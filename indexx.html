<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تقييم المهندسين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{
  --bg:#f3f5fa;--surface:#ffffff;--surface2:#eef2f8;--text:#14213d;--muted:#6b7a99;--line:#e2e7f1;
  --primary:#0f766e;--primary2:#14b8a6;--primary-soft:#d7f3ef;--accent:#f59e0b;
  --ok:#16a34a;--ok-soft:#dcfce7;--mid:#d97706;--mid-soft:#fef3c7;--bad:#dc2626;--bad-soft:#fee2e2;--abs:#111827;--leave:#94a3b8;
  --c100:#16a34a;--c90:#0d9488;--c75:#2563eb;--c50:#d97706;--c25:#ea580c;--c0:#dc2626;
  --shadow:0 6px 24px rgba(20,33,61,.07);--shadow2:0 18px 50px rgba(20,33,61,.18);--r:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1322;--surface:#141e33;--surface2:#1b2741;--text:#e6ecf7;--muted:#8e9cba;--line:#26344f;
  --primary:#2dd4bf;--primary2:#5eead4;--primary-soft:#123b3a;--ok-soft:#14321f;--mid-soft:#3a2c0e;--bad-soft:#3b1717;--abs:#000;
  --shadow:0 6px 24px rgba(0,0,0,.3);--shadow2:0 18px 50px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#0c1322;--surface:#141e33;--surface2:#1b2741;--text:#e6ecf7;--muted:#8e9cba;--line:#26344f;
  --primary:#2dd4bf;--primary2:#5eead4;--primary-soft:#123b3a;--ok-soft:#14321f;--mid-soft:#3a2c0e;--bad-soft:#3b1717;--abs:#000;
  --shadow:0 6px 24px rgba(0,0,0,.3);--shadow2:0 18px 50px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}

.hero{background:linear-gradient(135deg,#0f766e 0%,#115e59 45%,#134e4a 100%);color:#fff;padding:22px 16px 70px;position:relative;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.07);animation:float 14s ease-in-out infinite}
.hero::before{width:320px;height:320px;top:-140px;left:-80px}
.hero::after{width:220px;height:220px;bottom:-120px;right:10%;animation-delay:-6s}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,20px)}}
.wrap{max-width:1180px;margin:0 auto;position:relative;z-index:1}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:24px}
.brand h1{font-size:21px;font-weight:800}
.brand p{font-size:13px;opacity:.8}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.12);padding:4px;border-radius:14px}
.tab{padding:8px 16px;border-radius:10px;color:#fff;opacity:.8;font-weight:500;transition:.25s}
.tab.on{background:#fff;color:#0f766e;opacity:1;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.months{display:flex;gap:6px;overflow-x:auto;margin-top:18px;padding-bottom:4px;scrollbar-width:none}
.months::-webkit-scrollbar{display:none}
.mo{flex:0 0 auto;padding:8px 14px;border-radius:12px;background:rgba(255,255,255,.1);color:#fff;font-size:14px;transition:.25s;border:1px solid transparent}
.mo small{display:block;font-size:11px;opacity:.7}
.mo:hover{background:rgba(255,255,255,.18)}
.mo.on{background:#fff;color:#0f766e;font-weight:700;transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.2)}
.mo.now{border-color:rgba(255,255,255,.5)}
main{max-width:1180px;margin:-48px auto 40px;padding:0 16px;position:relative;z-index:2}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);animation:rise .5s both}
.stat .k{font-size:13px;color:var(--muted)}
.stat .v{font-size:26px;font-weight:800;margin-top:4px}
.stat .v small{font-size:13px;color:var(--muted);font-weight:500}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.search{flex:1;min-width:180px;position:relative}
.search input{width:100%;padding:10px 40px 10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);outline:none;transition:.2s}
.search input:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.search span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.btn{padding:10px 18px;border-radius:12px;font-weight:700;transition:.2s;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn-p{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 8px 20px rgba(15,118,110,.3)}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(15,118,110,.4)}
.btn-g{background:var(--surface);border:1px solid var(--line)}
.btn-g:hover{border-color:var(--primary);color:var(--primary)}
.btn-d{background:var(--bad-soft);color:var(--bad)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:transform .25s,box-shadow .25s;text-align:right}
.card.anim{animation:rise .45s both}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow2)}
.card-h{display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:800;color:#fff;flex:0 0 auto;font-size:15px}
.card-n{flex:1;min-width:0}
.card-n b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-n small{color:var(--muted);font-size:12px}
.ringbox{position:relative;flex:0 0 auto;display:grid;place-items:center}
.ring{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-linecap:round}
.ring .bg{stroke:var(--surface2)}
.ring .fg{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1),stroke .4s}
.ringbox .num{position:absolute;font-weight:800;font-size:14px}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.bar small{font-size:11px;color:var(--muted);display:block;margin-bottom:4px}
.bar .t{height:6px;background:var(--surface2);border-radius:9px;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:9px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700;margin-top:4px}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-abs{background:var(--abs);color:#fff}
.b-lv{background:var(--surface2);color:var(--muted)}
.b-no{background:var(--mid-soft);color:var(--mid)}
.strip{display:flex;gap:3px;margin-top:12px;flex-wrap:wrap}
.strip i{width:8px;height:8px;border-radius:50%;background:var(--surface2)}

.scrim{position:fixed;inset:0;background:rgba(8,15,30,.45);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.3s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(580px,100%);background:var(--bg);z-index:50;transform:translateX(-105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:var(--shadow2)}
.drawer.on{transform:none}
.dh{background:linear-gradient(135deg,#0f766e,#134e4a);color:#fff;padding:16px 16px 20px}
.dh-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ic{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;font-size:18px;transition:.2s}
.ic:hover{background:rgba(255,255,255,.25)}
.dh-mid{display:flex;align-items:center;gap:14px;margin-top:14px;animation:slideIn .4s both}
.dh-mid .who{flex:1;min-width:0}
.dh-mid .who b{font-size:20px;display:block}
.dh-mid .who small{opacity:.8}
.dh .ring .bg{stroke:rgba(255,255,255,.18)}
.dh .num{color:#fff;font-size:17px;text-align:center}
.dh .num small{display:block;font-size:10px;font-weight:500;opacity:.8}
@keyframes slideIn{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.dtabs{display:flex;gap:4px;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.dtab{flex:1;padding:9px 6px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted);transition:.2s}
.dtab.on{background:var(--primary-soft);color:var(--primary)}
.db{flex:1;overflow-y:auto;padding:16px}
.db-in{animation:rise .35s both}
.sec{background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.sec h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sec h3 .hint{margin-right:auto;font-size:12px;color:var(--muted);font-weight:500}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:10px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;transition:transform .15s,background .2s,border-color .2s,color .2s}
.opt:hover{transform:translateY(-2px);border-color:var(--oc)}
.opt:active{transform:scale(.94)}
.opt.on{background:var(--oc);border-color:var(--oc);color:#fff;box-shadow:0 6px 16px -4px var(--oc)}
.opt.pop{animation:pop .4s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
.opt small{font-weight:500;opacity:.75;margin-right:4px;font-size:11px}

.days{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scroll-behavior:smooth}
.dchip{flex:0 0 52px;padding:8px 0 12px;border-radius:12px;background:var(--surface2);text-align:center;transition:.2s;position:relative;border:2px solid transparent}
.dchip b{display:block;font-size:17px}
.dchip small{font-size:10px;color:var(--muted)}
.dchip.we{opacity:.5}
.dchip.on{background:var(--primary);color:#fff;opacity:1}
.dchip.on small{color:#fff}
.dchip .dot{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:7px;height:7px;border-radius:50%}
.dchip.today{border-color:var(--accent)}

.status{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.st{padding:14px 8px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:700;transition:.2s;display:flex;flex-direction:column;align-items:center;gap:4px}
.st span{font-size:22px}
.st small{font-size:11px;font-weight:500;color:var(--muted)}
.st:hover{transform:translateY(-2px)}
.st.on.rep{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.st.on.abs{border-color:var(--abs);background:var(--abs);color:#fff}
.st.on.abs small{color:#cbd5e1}
.st.on.lv{border-color:var(--leave);background:var(--surface2)}
.st.on{animation:pop .4s}
.absbox{text-align:center;padding:26px 10px;border-radius:14px;background:var(--abs);color:#fff;animation:rise .35s both}
.absbox .bd{width:46px;height:46px;border-radius:50%;background:#fff;margin:0 auto 10px;display:grid;place-items:center}
.absbox .bd i{width:26px;height:26px;border-radius:50%;background:#000;display:block}
.lvbox{text-align:center;padding:26px 10px;border-radius:14px;background:var(--surface2);color:var(--muted);animation:rise .35s both}
textarea,.inp{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);outline:none;resize:vertical;transition:.2s;line-height:1.7}
textarea:focus,.inp:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft);background:var(--surface)}
.rep-ok{display:flex;align-items:center;gap:6px;color:var(--ok);font-size:13px;font-weight:700;margin-top:8px;min-height:20px}
.rep-ok.no{color:var(--muted);font-weight:500}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;padding:4px 0}
.cell{aspect-ratio:1;border-radius:12px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;transition:.2s;position:relative;font-size:14px}
.cell:hover{transform:scale(1.08)}
.cell.we{opacity:.5}
.cell.rep{background:var(--ok);color:#fff}
.cell.abs{background:var(--abs);color:#fff}
.cell.lv{background:var(--leave);color:#fff}
.cell.miss{background:var(--bad-soft);color:var(--bad)}
.cell i{font-style:normal;font-size:10px;font-weight:500}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.phase{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.phase:last-child{border-bottom:none}
.pn{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--surface2);transition:.3s}
.ptag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;margin-right:auto;transition:.3s}
.qk{display:flex;gap:6px;margin-top:6px}
.qk button{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);transition:.2s}
.qk button:hover{background:var(--primary-soft);color:var(--primary)}
.brk{width:100%;border-collapse:collapse}
.brk td{padding:10px 4px;border-bottom:1px solid var(--line)}
.brk td:last-child{text-align:left;font-weight:700}
.brk tr:last-child td{border-bottom:none;font-size:17px;color:var(--primary)}
.mini{height:6px;background:var(--surface2);border-radius:9px;overflow:hidden;margin-top:6px}
.mini i{display:block;height:100%;border-radius:9px;transition:width .8s}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{background:var(--surface2);border-radius:12px;padding:10px;text-align:center}
.kpi b{display:block;font-size:20px}
.kpi small{font-size:11px;color:var(--muted)}
.df{padding:12px 16px;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:10px}
.df .btn{flex:1;justify-content:center}

.tblw{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:auto;animation:rise .4s both}
table.sum{width:100%;border-collapse:collapse;font-size:14px;min-width:980px}
.sum th{background:var(--surface2);padding:12px 8px;font-size:12px;color:var(--muted);white-space:nowrap}
.sum td{padding:12px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.sum td.nm{text-align:right;font-weight:700}
.sum tbody tr{transition:background .2s;animation:rise .4s both}
.sum tbody tr:hover{background:var(--primary-soft)}
.sum .tot{font-weight:800;color:var(--primary)}
.rank{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-weight:800;font-size:13px;background:var(--surface2)}
.rank.r1{background:#fde68a;color:#92400e}.rank.r2{background:#e5e7eb;color:#374151}.rank.r3{background:#fed7aa;color:#9a3412}
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wrow{display:flex;align-items:center;gap:10px;padding:8px 0}
.wrow label{flex:1}
.wrow input{width:90px;text-align:center}
.erow{display:grid;grid-template-columns:30px 1fr 44px;gap:8px;align-items:center;padding:6px 0}
.erow .inp{padding:8px 10px}
.warn{color:var(--bad);font-size:13px;margin-top:6px}
.ok-t{color:var(--ok);font-size:13px;margin-top:6px}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.rule{background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;font-size:13px;animation:rise .5s both}
.rule .sw{width:26px;height:26px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:13px}
.rule b{display:block;font-size:14px}
.rule small{color:var(--muted)}

.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,40px);background:#14213d;color:#fff;padding:12px 20px;border-radius:14px;opacity:0;transition:.35s cubic-bezier(.2,.8,.2,1);z-index:80;font-weight:700;box-shadow:var(--shadow2);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.conf{position:fixed;width:9px;height:14px;z-index:90;pointer-events:none;border-radius:2px}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

@media (max-width:760px){
  .stats{grid-template-columns:1fr 1fr}
  .set-grid,.rules{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .brand h1{font-size:18px}
  .tab{padding:7px 10px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <div class="logo">📋</div>
        <div><h1>تقييم المهندسين</h1><p>المشرفة: حنان عبدالله باني · <span id="yearLbl"></span></p></div>
      </div>
      <nav class="tabs" id="tabs"></nav>
    </div>
    <div class="months" id="months"></div>
  </div>
</header>

<main id="main"></main>

<div class="scrim" id="scrim" data-act="close"></div>
<aside class="drawer" id="drawer"></aside>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".json" hidden>

<script>
/* ===================== الإعداد ===================== */
const SUP = 'حنان عبدالله باني';
const DEFAULT_ENG = ['عماد عون كرود','ضياء الدين ناصر داقو','وليد ميلاد حمزة','محرم محمد عبود','الصادق اكرم الراجحي',
  'عبدالحيكم علي سويسي','وجيه عماد البدري','محمد عثمان الزناتي','محمد المبروك القنطري'];
const SCALE = {'ممتاز':100,'جيد جدا':90,'جيد':75,'مقبول':50,'ضعيف':25,'غير مقبول':0};
const WA_OPTS = ['ممتاز','جيد جدا','جيد','مقبول','ضعيف','غير مقبول'];
const MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const WD = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const WDS = ['أحد','إثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
const ITEMS = [['project','المشروع'],['daily','الأعمال اليومية'],['att','الحضور'],['whats','الواتساب']];
const AV_COLORS = ['#0f766e','#2563eb','#7c3aed','#db2777','#ea580c','#0891b2','#65a30d','#9333ea','#b45309'];
const ABS='غ', LEAVE='ع';
const KEY='hanan-eval-v2';

function freshState(){
  return { settings:{year:2026, weights:{project:40,whats:10,daily:30,att:20}, phaseW:[20,20,20,20,20]},
    engineers: DEFAULT_ENG.map((n,i)=>({id:'e'+(i+1), name:n})), months:{} };
}
let state;
try{ state=JSON.parse(localStorage.getItem(KEY))||freshState(); }catch(e){ state=freshState(); }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} }

const now=new Date(), TODAY=new Date(now.getFullYear(),now.getMonth(),now.getDate());
const thisYear=()=>now.getFullYear()===state.settings.year;
const ui={ tab:'eval', month: thisYear()?now.getMonth()+1:1, day: thisYear()?now.getDate():1, q:'', open:null, dtab:'day', anim:true, pop:null };

/* ===================== أدوات ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const avg=a=>a.reduce((s,x)=>s+x,0)/a.length;
const fmt=v=> v==null?'—':(+v).toFixed(2).replace(/\.?0+$/,'')||'0';
const daysIn=m=>new Date(state.settings.year,m,0).getDate();
const dateOf=(m,d)=>new Date(state.settings.year,m-1,d);
const wday=(m,d)=>dateOf(m,d).getDay();
const isWE=(m,d)=>{const w=wday(m,d);return w===5||w===6;};
const isToday=(m,d)=>+dateOf(m,d)===+TODAY;
function colorOf(p){ if(p==null) return 'var(--line)'; if(p>=100) return 'var(--c100)'; if(p>=90) return 'var(--c90)'; if(p>=75) return 'var(--c75)'; if(p>=50) return 'var(--c50)'; if(p>=25) return 'var(--c25)'; return 'var(--c0)'; }
function initials(n){const p=n.trim().split(/\s+/);return (p[0]?.[0]||'')+(p[1]?.[0]||'');}
const avColor=i=>AV_COLORS[i%AV_COLORS.length];
const engById=id=>state.engineers.find(e=>e.id===id);
const engIdx=id=>state.engineers.findIndex(e=>e.id===id);
const totalW=()=>Object.values(state.settings.weights).reduce((s,x)=>s+(+x||0),0);
const monthMax=()=>totalW()/12;
function getRec(m,id,create=true){
  const M=state.months[m]||(create?(state.months[m]={}):null); if(!M) return null;
  if(!M[id]){ if(!create) return null; M[id]={project:'',phases:['','','','',''],whats:'',days:{}}; }
  return M[id];
}
const dayVal=(r,d)=>((r&&r.days[d])||'').trim();
function dayKind(v){ if(!v) return 'empty'; if(v===ABS) return 'abs'; if(v===LEAVE) return 'lv'; return 'rep'; }
// نسبة المرحلة — نفس معادلة الأكسيل
function phasePct(t){ t=(t||'').trim(); if(!t) return null;
  if(t.includes('لم يبدأ')||t.includes('غير منجز')) return 0;
  if(t.includes('قيد التنفيذ')||t.includes('جاري')) return 50; return 100; }

/* ===================== الحساب (مطابق لمعادلات الأكسيل) ===================== */
function calc(m,id){
  const r=getRec(m,id,false), W=state.settings.weights, mw=k=>(+W[k]||0)/12, nd=daysIn(m);
  const o={project:null,whats:null,daily:null,att:null,total:null,rep:0,abs:0,lv:0,miss:0,den:0};
  if(r){
    const ph=r.phases.map(phasePct);
    if(ph.some(x=>x!=null)) o.project=ph.reduce((s,x,i)=>s+(x||0)*(+state.settings.phaseW[i]||0)/100,0)/100*mw('project');
    if(r.whats in SCALE) o.whats=SCALE[r.whats]/100*mw('whats');
    let any=false; const vals=[];
    for(let d=1;d<=nd;d++){
      const v=dayVal(r,d), k=dayKind(v), dt=dateOf(m,d), work=!isWE(m,d);
      if(v) any=true;
      if(k==='empty'){ if(work&&dt<TODAY){ vals.push(0); o.miss++; } }
      else if(k==='abs'){ vals.push(0); o.abs++; }
      else if(k==='rep'){ vals.push(100); o.rep++; }
      else o.lv++;
      if(work&&dt<=TODAY&&k!=='lv'){ o.den++; }
    }
    const absCounted=(()=>{let c=0;for(let d=1;d<=nd;d++){ if(!isWE(m,d)&&dateOf(m,d)<=TODAY&&dayVal(r,d)===ABS) c++; } return c;})();
    if(any){
      if(vals.length) o.daily=avg(vals)/100*mw('daily');
      if(o.den>0) o.att=(o.den-absCounted)/o.den*mw('att');
    }
  }
  const p=[o.project,o.whats,o.daily,o.att];
  o.total=p.every(x=>x==null)?null:p.reduce((s,x)=>s+(x||0),0);
  return o;
}
function yearCalc(id){
  const o={project:null,whats:null,daily:null,att:null,total:null,months:[]};
  for(let m=1;m<=12;m++){ const c=calc(m,id); o.months.push(c.total);
    for(const k of ['project','whats','daily','att','total']) if(c[k]!=null) o[k]=(o[k]||0)+c[k]; }
  if(o.total!=null) o.total=Math.min(100,o.total);
  return o;
}

/* ===================== عناصر بصرية ===================== */
function ring(val,max,size,stroke=7){
  const r=size/2-stroke,c=2*Math.PI*r,p=val==null?0:Math.min(1,val/max);
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
  <circle class="bg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}"/>
  <circle class="fg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}" stroke="${val==null?'var(--line)':colorOf(p*100)}" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${c*(1-p)}"/></svg>`;
}
function kick(root=document){
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    root.querySelectorAll('.fg[data-off]').forEach(el=>{el.style.strokeDashoffset=el.dataset.off;el.removeAttribute('data-off');});
    root.querySelectorAll('[data-w]').forEach(el=>{el.style.width=el.dataset.w;el.removeAttribute('data-w');});
    root.querySelectorAll('[data-count]').forEach(countUp);
  }));
}
function countUp(el){
  const to=parseFloat(el.dataset.count),dec=+(el.dataset.dec??2); el.removeAttribute('data-count');
  if(isNaN(to)){el.textContent='—';return;}
  const from=parseFloat(el.dataset.from||0),t0=performance.now();
  (function st(t){const k=Math.min(1,(t-t0)/900),e=1-Math.pow(1-k,3); el.textContent=(from+(to-from)*e).toFixed(dec);
    if(k<1) requestAnimationFrame(st); else el.dataset.from=to;})(t0);
}
function toast(msg){const t=$('#toast');t.innerHTML=msg;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),1600);}
function confetti(x,y){
  const cols=['#f59e0b','#14b8a6','#2563eb','#db2777','#16a34a'];
  for(let i=0;i<28;i++){const s=document.createElement('i');s.className='conf';s.style.background=cols[i%5];s.style.left=x+'px';s.style.top=y+'px';document.body.appendChild(s);
    const a=Math.random()*Math.PI*2,d=60+Math.random()*120;
    s.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+80}px) rotate(${Math.random()*720}deg)`,opacity:0}],{duration:900+Math.random()*500,easing:'cubic-bezier(.2,.8,.2,1)'}).onfinish=()=>s.remove();}
}
function dayBadge(v){
  const k=dayKind(v);
  if(k==='rep') return `<span class="badge b-ok">✓ تقرير يوم ${ui.day}</span>`;
  if(k==='abs') return `<span class="badge b-abs">● غائب يوم ${ui.day}</span>`;
  if(k==='lv')  return `<span class="badge b-lv">إجازة يوم ${ui.day}</span>`;
  return `<span class="badge b-no">لم يُسجّل يوم ${ui.day}</span>`;
}
function stripDots(m,r){
  let h='';const nd=daysIn(m); const any=r&&Object.keys(r.days).length>0;
  for(let d=1;d<=nd;d++){ if(isWE(m,d)&&!dayVal(r,d)) continue; const k=dayKind(dayVal(r,d)); const past=any&&dateOf(m,d)<TODAY;
    const c= k==='rep'?'var(--ok)':k==='abs'?'var(--abs)':k==='lv'?'var(--leave)':past?'var(--bad-soft)':'var(--surface2)';
    h+=`<i style="background:${c}" title="${d}"></i>`; }
  return h;
}

function renderEval(){
  const m=ui.month,max=monthMax(),list=filtered(),C=list.map(e=>({e,c:calc(m,e.id),r:getRec(m,e.id,false)}));

  const sc=C.filter(x=>x.c.total!=null), mean=sc.length?avg(sc.map(x=>x.c.total)):null;
  let h=`<div class="stats">
    <div class="stat"><div class="k">مهندسين حنان</div><div class="v" data-count="${state.engineers.length}" data-dec="0">0</div></div>
    <div class="stat" style="animation-delay:.06s"><div class="k">تم تسجيلهم يوم ${ui.day} ${MONTHS[m-1]}</div><div class="v"><span data-count="${done}" data-dec="0">0</span> <small>/ ${list.length}</small></div></div>
    <div class="stat" style="animation-delay:.12s"><div class="k">غياب يوم ${ui.day}</div><div class="v"><span data-count="${absToday}" data-dec="0">0</span> <small>●</small></div></div>
    <div class="stat" style="animation-delay:.18s"><div class="k">متوسط درجة الشهر</div><div class="v"><span ${mean!=null?`data-count="${mean}"`:''}>—</span> <small>/ ${fmt(max)}</small></div></div>
  </div>
  <div class="rules">
    <div class="rule"><div class="sw" style="background:var(--ok)">✓</div><div><b>تقرير مكتوب = يوم عمل</b><small>يُحسب 100% في الأعمال اليومية</small></div></div>
    <div class="rule" style="animation-delay:.05s"><div class="sw" style="background:var(--abs)">●</div><div><b>نقطة سوداء = غياب</b><small>0% في الأعمال + غياب في الحضور</small></div></div>
    <div class="rule" style="animation-delay:.1s"><div class="sw" style="background:var(--bad-soft);color:var(--bad)">0</div><div><b>يوم دوام فات بدون تقرير</b><small>0% في الأعمال اليومية</small></div></div>
  </div>
  <div class="toolbar">
    <div class="search"><span>🔍</span><input id="q" placeholder="ابحث عن مهندس..." value="${esc(ui.q)}"></div>
    <button class="btn btn-p" data-act="quick">⚡ ابدأ تسجيل يوم ${ui.day}</button>
  </div>`;
  if(!list.length){ h+='<div class="empty">لا يوجد مهندسون</div>'; $('#main').innerHTML=h; kick(); return; }
  h+='<div class="grid">';
  C.forEach(({e,c,r},n)=>{
    const W=state.settings.weights, i=engIdx(e.id);
    h+=`<button class="card ${ui.anim?'anim':''}" style="animation-delay:${n*0.05}s" data-act="open" data-id="${e.id}">
      <div class="card-h">
        <div class="av" style="background:${avColor(i)}">${esc(initials(e.name))}</div>
        <div class="card-n"><b>${esc(e.name)}</b><small>${c.rep} تقرير · ${c.abs} غياب</small><br>${dayBadge(dayVal(r,ui.day))}</div>
        <div class="ringbox">${ring(c.total,max,58,6)}<span class="num" ${c.total!=null?`data-count="${c.total}"`:''}>${c.total==null?'—':'0'}</span></div>
      </div>
      <div class="strip">${stripDots(m,r)}</div>
      <div class="bars">${ITEMS.map(([k,l])=>{const mx=(+W[k]||0)/12,p=c[k]==null?0:c[k]/mx*100;
        return `<div class="bar"><small>${l.split(' ')[0]}</small><div class="t"><i style="background:${colorOf(c[k]==null?null:p)}" data-w="${p}%"></i></div></div>`;}).join('')}</div>
    </button>`;
  });
  h+='</div>';
  $('#main').innerHTML=h; kick(); ui.anim=false;
}

function refreshRing(){
  const c=calc(ui.month,ui.open),max=monthMax(),fg=$('#dRing .fg'); if(!fg) return;
  const C=2*Math.PI*+fg.getAttribute('r'),p=c.total==null?0:Math.min(1,c.total/max);

  const n=$('#dNum'); if(c.total==null){n.textContent='—';n.dataset.from=0;} else {n.dataset.count=c.total;countUp(n);}
}

function dayChips(m,r){
  let h='';const nd=daysIn(m);
  for(let i=1;i<=nd;i++){ const k=dayKind(dayVal(r,i)), past=dateOf(m,i)<TODAY&&!isWE(m,i);
    const dc= k==='rep'?'var(--ok)':k==='abs'?'var(--abs)':k==='lv'?'var(--leave)':past?'var(--bad)':'';
    h+=`<button class="dchip ${i===ui.day?'on':''} ${isWE(m,i)?'we':''} ${isToday(m,i)?'today':''}" data-act="day" data-v="${i}"><small>${WDS[wday(m,i)]}</small><b>${i}</b>${dc?`<span class="dot" style="background:${dc};${k==='abs'?'box-shadow:0 0 0 2px #fff':''}"></span>`:''}</button>`; }
  return h;
}

function renderBody(animate){
  const e=engById(ui.open),m=ui.month,r=getRec(m,e.id,false)||{project:'',phases:['','','','',''],whats:'',days:{}};

    const v=dayVal(r,ui.day),k=dayKind(v);
    const mode= ui.forceRep ? 'rep' : (k==='empty'?'rep':k);

        <button class="st lv ${mode==='lv'?'on':''}" data-act="mode" data-v="lv"><span>🌴</span>إجازة / عطلة<small>لا يُحسب</small></button>
      </div>
      <div id="modeBox">${modeBox(mode,v)}</div>

  }
  else if(ui.dtab==='cal'){
    const first=wday(m,1);

    for(let i=0;i<first;i++) h+='<div></div>';
    for(let i=1;i<=nd;i++){ const k=dayKind(dayVal(r,i)), miss=k==='empty'&&!isWE(m,i)&&dateOf(m,i)<TODAY;

      h+=`<button class="cell ${cls} ${isWE(m,i)&&k==='empty'?'we':''}" style="${isToday(m,i)?'outline:2px solid var(--accent)':''}" data-act="pickday" data-v="${i}">${i}<i>${lbl}</i></button>`; }
    h+=`</div><div class="legend"><span><i style="background:var(--ok)"></i>تقرير</span><span><i style="background:var(--abs)"></i>غائب</span><span><i style="background:var(--leave)"></i>إجازة</span><span><i style="background:var(--bad-soft);border:1px solid var(--bad)"></i>يوم دوام فات بدون تقرير</span></div></div>`;
  }
  else if(ui.dtab==='proj'){
    h+=`<div class="sec"><h3>🏗 اسم المشروع</h3><input class="inp" id="projName" placeholder="مثال: صيانة شبكة المبنى الرئيسي" value="${esc(r.project)}"></div>
    <div class="sec"><h3>مراحل المشروع <span class="hint">اكتبي ما تم · أي نص = منجز</span></h3>`;
    for(let i=0;i<5;i++){
      h+=`<div class="phase"><div class="pn" id="pn${i}">${i+1}</div><div style="flex:1">
        <div style="display:flex;align-items:center;font-size:13px;color:var(--muted);margin-bottom:6px">المرحلة ${i+1} · وزنها ${state.settings.phaseW[i]}%<span class="ptag" id="pt${i}"></span></div>
        <textarea rows="2" data-ph="${i}" placeholder="مثال: تم تمديد الكوابل في الدور الأول">${esc(r.phases[i])}</textarea>
        <div class="qk"><button data-act="phq" data-i="${i}" data-v="قيد التنفيذ">قيد التنفيذ 50%</button><button data-act="phq" data-i="${i}" data-v="لم يبدأ">لم يبدأ 0%</button><button data-act="phq" data-i="${i}" data-v="">مسح</button></div>
      </div></div>`;
    }
    h+='</div>';
  }
  else {
    const rows=ITEMS.map(([k,l])=>{const mx=(+W[k]||0)/12,p=c[k]==null?0:c[k]/mx*100;
      return `<tr><td>${l}<div class="mini"><i data-w="${p}%" style="background:${colorOf(c[k]==null?null:p)}"></i></div></td><td>${fmt(c[k])} <small style="color:var(--muted);font-weight:500">/ ${fmt(mx)}</small></td></tr>`;}).join('');
    h+=`<div class="sec"><h3>📈 شهر ${m} بالأرقام</h3><div class="kpis">
        <div class="kpi"><b style="color:var(--ok)">${c.rep}</b><small>تقرير</small></div>
        <div class="kpi"><b>${c.abs}</b><small>● غياب</small></div>
        <div class="kpi"><b style="color:var(--bad)">${c.miss}</b><small>يوم بدون تقرير</small></div>
        <div class="kpi"><b>${c.lv}</b><small>إجازة</small></div></div></div>
      <div class="sec"><h3>💬 التواصل عبر الواتساب <span class="hint">تقييم شهري</span></h3>${waOpts(r.whats)}</div>
      <div class="sec"><h3>📊 درجة شهر ${m}</h3><table class="brk">${rows}<tr><td>المجموع الشهري</td><td>${fmt(c.total)} / ${fmt(monthMax())}</td></tr></table></div>`;
  }
  const db=$('#db'); db.innerHTML=`<div class="${animate?'db-in':''}">${h}</div>`; kick(db);
  const on=db.querySelector('.dchip.on'); on&&on.scrollIntoView({inline:'center',block:'nearest'});
  if(ui.dtab==='proj') for(let i=0;i<5;i++) phaseTag(i, r.phases[i]);
  ui.pop=null;
}
function modeBox(mode,v){
  if(mode==='abs') return `<div class="absbox"><div class="bd"><i></i></div><b>غائب</b><div style="font-size:13px;opacity:.75;margin-top:4px">يُحسب 0 في الأعمال اليومية ويُخصم من الحضور</div></div>`;
  if(mode==='lv') return `<div class="lvbox">🌴<br><b>إجازة / عطلة رسمية</b><div style="font-size:13px;margin-top:4px">هذا اليوم لا يدخل في الحساب</div></div>`;
  const txt=dayKind(v)==='rep'?v:'';
  return `<textarea id="rep" rows="7" placeholder="الصقي هنا تقرير المهندس أو أعماله اليومية كما وصلتك...">${esc(txt)}</textarea>
    <div class="rep-ok ${txt?'':'no'}" id="repOk">${txt?'✓ محفوظ · يُحسب يوم عمل 100%':'اكتبي أو الصقي التقرير — يُحفظ تلقائياً'}</div>`;
}
function waOpts(cur){
  return `<div class="opts">${WA_OPTS.map(o=>{const p=SCALE[o],on=cur===o;
    return `<button class="opt ${on?'on':''} ${on&&ui.pop==='wa'+o?'pop':''}" style="--oc:${colorOf(p)}" data-act="wa" data-v="${o}">${o}<small>${p}%</small></button>`;}).join('')}</div>`;
}
function phaseTag(i,t){
  const p=phasePct(t),tag=$('#pt'+i),pn=$('#pn'+i); if(!tag) return;
  if(p==null){ tag.textContent=''; tag.style.background='transparent'; pn.style.background=''; pn.style.color=''; return; }
  const col=p===100?'var(--ok)':p===50?'var(--mid)':'var(--bad)';
  tag.textContent=(p===100?'منجز ':p===50?'قيد التنفيذ ':'لم يبدأ ')+p+'%'; tag.style.background=col; tag.style.color='#fff';
  pn.style.background=col; pn.style.color='#fff';
}
function setDay(v){
  const r=getRec(ui.month,ui.open); v=(v||'').trim();
  if(v) r.days[ui.day]=v; else delete r.days[ui.day];
  save(); refreshRing();
  const row=$('#daysRow'); if(row){ const sl=row.scrollLeft; row.innerHTML=dayChips(ui.month,r); row.scrollLeft=sl; }
}

/* ===================== الملخص السنوي ===================== */
function renderSum(){
  const rows=state.engineers.map(e=>({e,y:yearCalc(e.id)}));
  const ranked=rows.filter(x=>x.y.total!=null).map(x=>x.y.total).sort((a,b)=>b-a);
  const W=state.settings.weights;
  let h=`<div class="toolbar"><div style="flex:1;font-weight:700">الملخص السنوي – المجموع النهائي من 100</div>
    <button class="btn btn-p" data-act="xlsx" id="xbtn">⬇️ تصدير ملف Excel</button></div>
  <div class="tblw"><table class="sum"><thead><tr><th>#</th><th style="text-align:right">اسم المهندس</th>
    ${MONTHS.map((n,i)=>`<th>ش${i+1}</th>`).join('')}
    <th>المشروع /${W.project}</th><th>اليومي /${W.daily}</th><th>الحضور /${W.att}</th><th>واتساب /${W.whats}</th><th>المجموع /100</th><th>الترتيب</th></tr></thead><tbody>`;
  rows.forEach(({e,y},i)=>{ const rk=y.total==null?null:ranked.indexOf(y.total)+1;
    h+=`<tr style="animation-delay:${i*.04}s"><td>${i+1}</td><td class="nm">${esc(e.name)}</td>${y.months.map(v=>`<td>${fmt(v)}</td>`).join('')}
    <td>${fmt(y.project)}</td><td>${fmt(y.daily)}</td><td>${fmt(y.att)}</td><td>${fmt(y.whats)}</td><td class="tot">${fmt(y.total)}</td>
    <td>${rk?`<span class="rank ${rk<=3?'r'+rk:''}">${rk}</span>`:'—'}</td></tr>`; });
  h+=`</tbody></table></div><div class="foot">ملف الـExcel المصدَّر بنفس شكل شيت حنان ومعادلاته — تقدري تكملي التعديل عليه في Excel مباشرة</div>`;
  $('#main').innerHTML=h;
}

/* ===================== تصدير Excel من القالب ===================== */
function b64ToBuf(b64){ const bin=atob(b64), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u.buffer; }
async function exportXlsx(){
  if(typeof ExcelJS==='undefined'){ toast('⚠️ مكتبة Excel لم تُحمّل — تأكدي من الإنترنت'); return; }
  const btn=$('#xbtn'); if(btn){ btn.disabled=true; btn.innerHTML='<span class="spin"></span> جاري التجهيز...'; }
  try{
    const wb=new ExcelJS.Workbook();
    await wb.xlsx.load(b64ToBuf(document.getElementById('tpl').textContent.trim()));
    const S=state.settings, n=Math.min(32,state.engineers.length), Y=S.year;
    // الأوزان
    const w=wb.getWorksheet('الأوزان');
    w.getCell('B4').value=+S.weights.project; w.getCell('B5').value=+S.weights.whats; w.getCell('B6').value=+S.weights.daily; w.getCell('B7').value=+S.weights.att;
    // الأسماء
    const sm=wb.getWorksheet('الملخص السنوي');
    for(let i=0;i<32;i++){ const row=5+i, e=state.engineers[i];
      sm.getCell('B'+row).value = i<n ? e.name : null;
      sm.getCell('C'+row).value = i<n ? SUP : null;
      sm.getRow(row).hidden = i>=n; }
    // الأشهر
    for(let m=1;m<=12;m++){
      const ws=wb.getWorksheet('شهر '+m);
      ws.getCell('D2').value=new Date(Date.UTC(Y,m,0));
      for(let k=0;k<5;k++) ws.getCell(3,13+k).value=(+S.phaseW[k]||0)/100;
      for(let i=0;i<32;i++){
        const row=5+i; ws.getRow(row).hidden = i>=n;
        const r = i<n ? getRec(m,state.engineers[i].id,false) : null;
        ws.getCell('I'+row).value = r&&r.whats ? r.whats : null;
        ws.getCell('L'+row).value = r&&r.project ? r.project : null;
        for(let k=0;k<5;k++) ws.getCell(row,13+k).value = r&&r.phases[k] ? r.phases[k] : null;
        for(let d=1;d<=31;d++) ws.getCell(row,17+d).value = r&&r.days[d] ? String(r.days[d]).trim() : null;
      }
    }
    // قائمة البحث
    const b=wb.getWorksheet('بحث');
    b.getCell('B3').dataValidation={type:'list',allowBlank:true,formulae:[`'الملخص السنوي'!$B$5:$B$${4+Math.max(1,n)}`]};
    wb.calcProperties.fullCalcOnLoad=true;
    const buf=await wb.xlsx.writeBuffer();
    const url=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    const a=document.createElement('a'); a.href=url; a.download=`تقييم_المهندسين_${Y}.xlsx`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    toast('⬇️ تم تصدير ملف Excel');
  }catch(err){ console.error(err); toast('⚠️ حدث خطأ أثناء التصدير'); }
  if(btn){ btn.disabled=false; btn.innerHTML='⬇️ تصدير ملف Excel'; }
}

/* ===================== الإعدادات ===================== */
function renderSet(){
  const W=state.settings.weights,tw=totalW(),pw=state.settings.phaseW.reduce((s,x)=>s+(+x||0),0);
  let h=`<div class="set-grid">
  <div class="sec" style="animation:rise .4s both"><h3>⚖️ توزيع الدرجات (من 100)</h3>
    ${ITEMS.map(([k,l])=>`<div class="wrow"><label>${l}</label><input class="inp" type="number" min="0" max="100" data-wk="${k}" value="${W[k]}"><small style="color:var(--muted);width:80px">${fmt((+W[k]||0)/12)} شهرياً</small></div>`).join('')}
    ${tw===100?`<div class="ok-t">✓ المجموع ${tw}</div>`:`<div class="warn">⚠️ المجموع ${tw} — لازم يكون 100</div>`}</div>
  <div class="sec" style="animation:rise .4s .06s both"><h3>🏗 أوزان مراحل المشروع (%)</h3>
    ${state.settings.phaseW.map((v,i)=>`<div class="wrow"><label>المرحلة ${i+1}</label><input class="inp" type="number" min="0" max="100" data-pw="${i}" value="${v}"></div>`).join('')}
    ${pw===100?`<div class="ok-t">✓ المجموع ${pw}%</div>`:`<div class="warn">⚠️ المجموع ${pw}% — لازم يكون 100%</div>`}</div></div>
  <div class="sec" style="animation:rise .4s .1s both"><h3>👥 المهندسون (${state.engineers.length}) <span class="hint">يُحفظ تلقائياً</span></h3>`;
  state.engineers.forEach((e,i)=>{ h+=`<div class="erow"><span style="color:var(--muted)">${i+1}</span><input class="inp" data-en="${e.id}" value="${esc(e.name)}"><button class="btn btn-d" style="padding:8px;justify-content:center" data-act="delEng" data-id="${e.id}" title="حذف">🗑</button></div>`; });
  h+=`<div style="margin-top:12px"><button class="btn btn-g" data-act="addEng">➕ إضافة مهندس</button></div></div>
  <div class="sec" style="animation:rise .4s .14s both"><h3>💾 النسخ الاحتياطي</h3>
    <p style="color:var(--muted);font-size:14px;margin-bottom:12px">البيانات محفوظة في هذا المتصفح فقط. خذي نسخة احتياطية كل أسبوع، وتقدري تفتحيها على أي جهاز آخر.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-p" data-act="backup">⬇️ حفظ نسخة احتياطية</button>
      <button class="btn btn-g" data-act="restore">⬆️ استرجاع نسخة</button>
      <button class="btn btn-g" data-act="theme">🌓 الوضع الليلي</button>
      <button class="btn btn-d" data-act="reset">مسح كل البيانات</button></div></div>
  <div class="foot">مبني على شيت التقييم · إعداد: حنان باني</div>`;
  $('#main').innerHTML=h;
}

function renderMain(){ renderHeader(); if(ui.tab==='eval') renderEval(); else if(ui.tab==='sum') renderSum(); else renderSet(); }

/* ===================== الأحداث ===================== */
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act,v=b.dataset.v;
  switch(a){
    case 'tab': ui.tab=v; ui.anim=true; renderMain(); break;
    case 'month': ui.month=+v; ui.day=Math.min(ui.day,daysIn(ui.month)); if(thisYear()&&now.getMonth()+1===ui.month) ui.day=now.getDate(); ui.anim=true; renderMain(); break;
    case 'open': ui.dtab='day'; ui.forceRep=false; openEng(b.dataset.id); break;
    case 'quick': { const l=filtered(); if(l.length){ ui.dtab='day'; ui.forceRep=false; openEng(l[0].id); } break; }
    case 'close': closeDrawer(); break;
    case 'nav': ui.forceRep=false; navEng(+v); break;
    case 'dtab': ui.dtab=v; ui.forceRep=false; renderDrawer(false); break;
    case 'day': ui.day=+v; ui.forceRep=false; renderBody(false); break;
    case 'pickday': ui.day=+v; ui.dtab='day'; ui.forceRep=false; renderDrawer(false); break;
    case 'mode': {
      const r=getRec(ui.month,ui.open), cur=dayKind(dayVal(r,ui.day));
      if(v==='abs'){ setDay(cur==='abs'?'':ABS); ui.forceRep=cur==='abs'; toast(cur==='abs'?'↩️ تم إلغاء الغياب':'● تم تسجيل غياب'); }
      else if(v==='lv'){ setDay(cur==='lv'?'':LEAVE); ui.forceRep=cur==='lv'; toast(cur==='lv'?'↩️ تم الإلغاء':'🌴 تم تسجيل إجازة'); }
      else { if(cur==='abs'||cur==='lv') setDay(''); ui.forceRep=true; }
      renderBody(false);
      if(v==='rep'){ const t=$('#rep'); t&&t.focus(); }
      break; }
    case 'wa': { const r=getRec(ui.month,ui.open); const cur=r.whats; r.whats=cur===v?'':v; ui.pop=cur===v?null:'wa'+v; save(); refreshRing(); renderBody(false); toast(cur===v?'↩️ تم الإلغاء':'✓ تم الحفظ'); break; }
    case 'phq': { const i=+b.dataset.i, r=getRec(ui.month,ui.open), t=document.querySelector(`[data-ph="${i}"]`);
      r.phases[i]=v; if(t) t.value=v; save(); phaseTag(i,v); refreshRing(); break; }
    case 'xlsx': exportXlsx(); break;
    case 'addEng': { const id='e'+Date.now(); state.engineers.push({id,name:'مهندس جديد'}); save(); renderSet(); setTimeout(()=>{const i=document.querySelector(`[data-en="${id}"]`);i&&(i.focus(),i.select());},50); break; }
    case 'delEng': { const e=engById(b.dataset.id); if(e&&confirm(`حذف ${e.name}؟`)){ state.engineers=state.engineers.filter(x=>x.id!==e.id); save(); renderSet(); toast('🗑 تم الحذف'); } break; }
    case 'backup': { const u=URL.createObjectURL(new Blob([JSON.stringify(state,null,1)],{type:'application/json'})),l=document.createElement('a');
      l.href=u; l.download=`نسخة_تقييم_المهندسين_${new Date().toISOString().slice(0,10)}.json`; l.click(); URL.revokeObjectURL(u); toast('💾 تم حفظ النسخة'); break; }
    case 'restore': $('#fileIn').click(); break;
    case 'theme': { const r=document.documentElement, dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
      r.dataset.theme=dark?'light':'dark'; try{localStorage.setItem(KEY+'-theme',r.dataset.theme);}catch(e){} break; }
    case 'reset': if(confirm('متأكدة؟ سيتم مسح كل البيانات (خذي نسخة احتياطية أولاً)')){ state=freshState(); save(); renderMain(); toast('تم المسح'); } break;
  }
});
let repTimer;
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='q'){ ui.q=t.value; const p=t.selectionStart; renderEval(); const q=$('#q'); q.focus(); q.setSelectionRange(p,p); }
  else if(t.id==='rep'){ setDay(t.value); const ok=$('#repOk'), has=t.value.trim();
    ok.className='rep-ok '+(has?'':'no'); ok.textContent=has?'✓ محفوظ · يُحسب يوم عمل 100%':'اكتبي أو الصقي التقرير — يُحفظ تلقائياً';
    clearTimeout(repTimer); if(has&&!t._was){ toast('✓ تم تسجيل التقرير'); } t._was=!!has; }
  else if(t.dataset.ph!=null){ const i=+t.dataset.ph, r=getRec(ui.month,ui.open), was=phasePct(r.phases[i]);
    r.phases[i]=t.value; save(); phaseTag(i,t.value); refreshRing();
    if(was!==100&&phasePct(t.value)===100&&t.value.trim().length===1){ const rc=t.getBoundingClientRect(); confetti(rc.left+rc.width/2,rc.top); } }
  else if(t.id==='projName'){ getRec(ui.month,ui.open).project=t.value; save(); }
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.wk){ state.settings.weights[t.dataset.wk]=+t.value||0; save(); renderSet(); }
  else if(t.dataset.pw!==undefined){ state.settings.phaseW[+t.dataset.pw]=+t.value||0; save(); renderSet(); }
  else if(t.dataset.en){ const e=engById(t.dataset.en); if(e){ e.name=t.value.trim()||e.name; save(); toast('✓ تم الحفظ'); } }
});
$('#fileIn').addEventListener('change',ev=>{ const f=ev.target.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ try{ const s=JSON.parse(rd.result); if(!s.engineers||!s.settings) throw 0; state=s; save(); renderMain(); toast('⬆️ تم الاسترجاع'); }catch(e){ toast('⚠️ الملف غير صالح'); } ev.target.value=''; };
  rd.readAsText(f); });
document.addEventListener('keydown',ev=>{ if(!ui.open) return; if(ev.key==='Escape') closeDrawer(); if(ev.target.matches('input,textarea')) return;
  if(ev.key==='ArrowLeft') navEng(1); if(ev.key==='ArrowRight') navEng(-1); });
(()=>{ let x0=null; const d=$('#drawer');
  d.addEventListener('touchstart',e=>{ if(!e.target.closest('.days,textarea')) x0=e.touches[0].clientX; },{passive:true});
  d.addEventListener('touchend',e=>{ if(x0==null) return; const dx=e.changedTouches[0].clientX-x0; x0=null; if(Math.abs(dx)>70) navEng(dx>0?-1:1); },{passive:true}); })();
try{ const th=localStorage.getItem(KEY+'-theme'); if(th) document.documentElement.dataset.theme=th; }catch(e){}
renderMain();
